<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atari engine — Examples</title><style>:root{color-scheme:dark;font:14px system-ui;color:#ddd;background:#171717}body{max-width:900px;margin:auto;padding:30px}h1{font-size:26px;font-weight:500}p{color:#aaa;line-height:1.6}nav{display:flex;gap:10px;margin:24px 0}button{background:none;color:#aaa;padding:10px 18px;border:1px solid #555;cursor:pointer}button[aria-pressed=true]{background:#ddd;color:#171717}canvas{display:block;width:min(100%,640px);aspect-ratio:4/3;image-rendering:pixelated;margin:auto}footer{margin-top:24px;color:#999;font-size:12px}a{color:#cbc5a3}</style></head><body><p>ATARI ENGINE / 0.1</p><h1>A renderer, independent of any game.</h1><p>Reference studies running from the standalone engine project.</p><nav><button data-example="arena" aria-pressed="true">Arena</button><button data-example="room" aria-pressed="false">Room</button></nav><canvas aria-label="Arena reference study"></canvas><footer><p id="details"></p><a href="../README.md">Engine documentation</a></footer><script type="module">
import {arena,room} from './scenes.mjs';
const canvas=document.querySelector('canvas'),examples={arena,room};function show(name){const f=examples[name]();f.present(canvas);canvas.setAttribute('aria-label',name+' reference study');document.querySelector('#details').textContent=`160 × 192 · 4:3 display · ${f.stats().colors} colors · No game dependencies`;for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.example===name));}for(const b of document.querySelectorAll('button'))b.onclick=()=>show(b.dataset.example);show('arena');
</script></body></html>
